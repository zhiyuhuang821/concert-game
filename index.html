<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>follow</title>
  <style>
    body {
      background: #1a1a1a; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: "Courier New", monospace;
      touch-action: none; 
      overflow: hidden;
    }
    #game-wrap { position: relative; width: 360px; height: 640px; max-width: 100vw; max-height: 100vh; }
    canvas { 
      background: #2a2a35; 
      display: block; 
      width: 100%; height: 100%;
      image-rendering: pixelated;
      touch-action: none;
    }
    .overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      gap: 15px; color: #fff; text-align: center; padding: 20px;
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay h1 { color: #ffd93d; font-size: 26px; margin: 0; text-shadow: 2px 2px 0 #000; }
    .overlay p { font-size: 15px; color: #ccc; line-height: 1.6; margin: 5px 0; }
    
    .media-container {
      width: 220px; height: 220px;
      margin-bottom: 5px;
      position: relative;
      display: flex; justify-content: center; align-items: center;
    }
    
    #album-img {
      width: 100%; height: 100%;
      border: 4px solid #4ecdc4; border-radius: 8px;
      object-fit: cover; box-shadow: 0 0 20px rgba(78, 205, 196, 0.4);
      display: none; background: #222;
    }

    #fail-anim, #hidden-anim {
      width: 100%; height: 100%;
      display: none; image-rendering: pixelated;
    }

    button {
      font-family: inherit; font-size: 16px; padding: 10px 24px;
      background: #4ecdc4; color: #111; border: none; cursor: pointer;
      box-shadow: 4px 4px 0 #fff; font-weight: bold; margin-top: 10px;
      border-radius: 4px;
    }
    button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #fff; }
    
    .btn-group { display: flex; gap: 15px; margin-top: 10px; }
    .btn-yes { background: #b388ff; }

    #skip-btn {
      position: absolute; bottom: 30px; right: 20px;
      background: transparent; color: #666; border: none; box-shadow: none;
      font-size: 12px; cursor: pointer; z-index: 10;
    }
    
    #play-song-btn {
      display: none;
      background: #ffd93d;
      font-size: 18px;
      padding: 12px 30px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 4px 4px 0 #fff; }
      50% { transform: scale(1.05); box-shadow: 6px 6px 0 #fff; }
      100% { transform: scale(1); box-shadow: 4px 4px 0 #fff; }
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="360" height="640"></canvas>

    <div id="start-screen" class="overlay hidden">
      <h1>PIXEL CATCH</h1>
      <p>左右移动，接住掉落物<br>小心炸弹扣分！</p>
      <button id="start-btn">TAP TO START</button>
    </div>

    <div id="end-screen" class="overlay hidden">
      <div class="media-container">
        <img id="album-img" src="" alt="Album Cover" onerror="this.style.display='none'">
        <img id="fail-anim" src="player_normal.png" alt="Fail Animation">
        <img id="hidden-anim" src="hidden1.png" alt="Hidden Animation">
      </div>
      
      <h1 id="end-title">CLEAR!</h1>
      <p id="end-desc">即将播放...</p>
      
      <!-- 手动播放按钮 -->
      <button id="play-song-btn">▶ 点击播放歌曲</button>
      
      <button id="replay-btn" style="display: none;">再玩一次</button>
      
      <div id="hidden-prompt" class="btn-group" style="display: none;">
        <button id="unlock-hidden-btn" class="btn-yes">是，解锁隐藏！</button>
        <button id="skip-hidden-btn">跳过</button>
      </div>
    </div>

    <button id="skip-btn">SKIP >></button>
  </div>

  <!-- 👇 全部改回本地读取。大写后缀名完全没问题 -->
  <audio id="bgmIntro" src="bgm_intro.mp3" loop preload="auto"></audio>
  <audio id="bgmGame" src="bgm_game.mp3" loop preload="auto"></audio>
  <audio id="sfxClick" src="sfx_click.mp3" preload="auto"></audio>

  <audio id="mediaA" src="songA.mp3" preload="auto"></audio>
  <audio id="mediaB" src="songB.mp3" preload="auto"></audio>
  <audio id="mediaC" src="songC.mp3" preload="auto"></audio>
  <audio id="mediaD" src="songD.mp3" preload="auto"></audio>
  
  <audio id="mediaFail" src="fail.mp3" preload="auto"></audio>
  <audio id="mediaHidden" src="songHidden.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    ctx.imageSmoothingEnabled = false;

    const PLAYER_W = 176, PLAYER_H = 176, PLAYER_Y = H - 170, PLAYER_EDGE_PADDING = 40; 
    const ITEM_SIZE = 64, SPAWN_INTERVAL = 50, BASE_SPEED = 1.8, TARGET_SCORE = 20, MAX_FAILS = 5;

    const imgBg = new Image(); imgBg.src = 'bg.png';
    const BIRD_W = 144, BIRD_H = 96; 
    const imgBirdLeft = new Image(); imgBirdLeft.src = 'bird_left.png';
    const imgBirdRight = new Image(); imgBirdRight.src = 'bird_right.png';
    const imgNormal = new Image(); imgNormal.src = 'player_normal.png';
    const imgHappy  = new Image(); imgHappy.src = 'player_happy.png';
    const imgHurt   = new Image(); imgHurt.src = 'player_hurt.png';
    
    const itemImgs = { A: new Image(), B: new Image(), C: new Image(), D: new Image(), X: new Image() };
    itemImgs.A.src = 'A.png'; itemImgs.B.src = 'B.png'; itemImgs.C.src = 'C.png'; itemImgs.D.src = 'D.png'; itemImgs.X.src = 'hurt.png'; 

    const ITEM_NAMES = { A: '❤️', B: '🎤', C: '⛰️', D: '🧋' };
    const TYPES = {
      A: { color: '#ffd93d', score: 1,  label: 'A' },
      B: { color: '#ff6b9d', score: 1,  label: 'B' },
      C: { color: '#4ecdc4', score: 1,  label: 'C' },
      D: { color: '#b388ff', score: 1,  label: 'D' },
      X: { color: '#e94560', score: -1, label: 'X' }
    };

    const startScreen = document.getElementById('start-screen');
    const endScreen = document.getElementById('end-screen');
    const skipBtn = document.getElementById('skip-btn');
    const endTitle = document.getElementById('end-title');
    const endDesc = document.getElementById('end-desc');
    const albumImg = document.getElementById('album-img');
    
    const failAnim = document.getElementById('fail-anim'); 
    const hiddenAnim = document.getElementById('hidden-anim');
    const startBtn = document.getElementById('start-btn');
    const replayBtn = document.getElementById('replay-btn');
    const playSongBtn = document.getElementById('play-song-btn'); 
    
    const hiddenPrompt = document.getElementById('hidden-prompt');
    const unlockHiddenBtn = document.getElementById('unlock-hidden-btn');
    const skipHiddenBtn = document.getElementById('skip-hidden-btn');
    
    const medias = {
      A: document.getElementById('mediaA'),
      B: document.getElementById('mediaB'),
      C: document.getElementById('mediaC'),
      D: document.getElementById('mediaD'),
      Fail: document.getElementById('mediaFail'), 
      Hidden: document.getElementById('mediaHidden')
    };

    const bgmIntro = document.getElementById('bgmIntro');
    const bgmGame = document.getElementById('bgmGame');
    const sfxClick = document.getElementById('sfxClick');

    let currentBest = 'A'; 
    let playerX, items, frameCount, score, gameOver, counts;
    let running = false;
    let expressionTimer = 0, currentExpression = 'normal'; 
    let birds = [], BIRD_SPAWN_INTERVAL = 150; 
    let isPlayingIntro = true, introFrame = 0, introPlayerX = -PLAYER_W; 
    
    let failAnimInterval = null;
    let hiddenAnimInterval = null;
    let hiddenFrameIndex = 1;

    function playClick() {
      sfxClick.currentTime = 0; 
      sfxClick.volume = 0.6;
      sfxClick.play().catch(() => {});
    }

    function initGame() {
      playerX = W / 2 - PLAYER_W / 2;
      items = []; birds = []; frameCount = 0; score = 0;
      counts = { A: 0, B: 0, C: 0, D: 0, X: 0 };
      gameOver = false; expressionTimer = 0; currentExpression = 'normal';
      
      if (failAnimInterval) clearInterval(failAnimInterval);
      if (hiddenAnimInterval) clearInterval(hiddenAnimInterval);
      
      albumImg.style.display = 'none';
      failAnim.style.display = 'none';
      hiddenAnim.style.display = 'none';
      replayBtn.style.display = 'none';
      playSongBtn.style.display = 'none'; 
      hiddenPrompt.style.display = 'none';
      
      Object.values(medias).forEach(m => { m.pause(); m.currentTime = 0; });
      bgmGame.pause(); bgmGame.currentTime = 0;
    }

    function movePlayerTo(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      playerX = (clientX - rect.left) * scaleX - PLAYER_W / 2;
      playerX = Math.max(-PLAYER_EDGE_PADDING, Math.min(W - PLAYER_W + PLAYER_EDGE_PADDING, playerX));
    }

    canvas.addEventListener('mousemove', (e) => { if (running) movePlayerTo(e.clientX); });
    canvas.addEventListener('touchstart', (e) => { if (running) { e.preventDefault(); movePlayerTo(e.touches[0].clientX); } }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { if (running) { e.preventDefault(); movePlayerTo(e.touches[0].clientX); } }, { passive: false });

    function randomType() {
      const r = Math.random();
      if (r < 0.20) return 'A'; if (r < 0.40) return 'B';
      if (r < 0.60) return 'C'; if (r < 0.85) return 'D'; 
      return 'X'; 
    }

    function spawnItem() {
      items.push({
        type: randomType(),
        x: Math.random() * (W - ITEM_SIZE),
        y: -ITEM_SIZE,
        speed: BASE_SPEED + Math.random() * 1.5
      });
    }

    function spawnBird() {
      const y = 50 + Math.random() * (H / 2 - 100);
      const speed = 2 + Math.random() * 3; 
      const fromLeft = Math.random() < 0.5;
      birds.push({ x: fromLeft ? -BIRD_W : W, y, vx: fromLeft ? speed : -speed, fromLeft });
    }

    function update() {
      if (gameOver) return;
      frameCount++;

      if (frameCount % SPAWN_INTERVAL === 0) spawnItem();
      if (frameCount % BIRD_SPAWN_INTERVAL === 0 && imgBirdLeft.complete && imgBirdRight.complete) spawnBird();

      if (expressionTimer > 0) {
        expressionTimer--;
        if (expressionTimer === 0) currentExpression = 'normal';
      }

      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i]; b.x += b.vx;
        if ((b.vx > 0 && b.x > W) || (b.vx < 0 && b.x < -BIRD_W)) birds.splice(i, 1);
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.speed;

        const playerCenterX = playerX + PLAYER_W / 2;
        const itemCenterX = it.x + ITEM_SIZE / 2;
        const hitX = Math.abs(playerCenterX - itemCenterX) < 55;
        const hitY = it.y + ITEM_SIZE >= PLAYER_Y + 30 && it.y + ITEM_SIZE <= PLAYER_Y + PLAYER_H;

        if (hitY && hitX) {
          const def = TYPES[it.type];
          counts[it.type]++;
          score += def.score;
          if (score < 0) score = 0;

          if (it.type === 'X') {
            currentExpression = 'hurt'; expressionTimer = 45; 
          } else {
            currentExpression = 'happy'; expressionTimer = 25; 
          }

          if (score >= TARGET_SCORE) { endGame(true); return; }
          if (counts.X >= MAX_FAILS) { endGame(false); return; }

          items.splice(i, 1);
          continue;
        }
        if (it.y > H) items.splice(i, 1);
      }
    }

    function draw() {
      if (imgBg.complete && imgBg.naturalWidth > 0) {
        ctx.drawImage(imgBg, 0, 0, W, H);
      } else {
        ctx.fillStyle = '#2a2a35'; ctx.fillRect(0, 0, W, H);
      }

      birds.forEach(b => {
        const activeBirdImg = b.fromLeft ? imgBirdRight : imgBirdLeft;
        if (activeBirdImg.complete) ctx.drawImage(activeBirdImg, b.x, b.y, BIRD_W, BIRD_H);
      });

      items.forEach(it => {
        const def = TYPES[it.type]; const img = itemImgs[it.type];
        if (img.complete && img.naturalWidth > 0) {
          ctx.drawImage(img, it.x, it.y, ITEM_SIZE, ITEM_SIZE);
        } else {
          ctx.fillStyle = def.color; ctx.fillRect(it.x, it.y, ITEM_SIZE, ITEM_SIZE);
        }
      });

      let activeImg = imgNormal;
      if (currentExpression === 'happy' && imgHappy.complete) activeImg = imgHappy;
      if (currentExpression === 'hurt' && imgHurt.complete) activeImg = imgHurt;
      
      if (activeImg.complete && activeImg.naturalWidth > 0) {
        ctx.drawImage(activeImg, playerX, PLAYER_Y, PLAYER_W, PLAYER_H);
      } else {
        ctx.fillStyle = currentExpression === 'hurt' ? '#ff0000' : (currentExpression === 'happy' ? '#ffd93d' : '#4ecdc4');
        ctx.fillRect(playerX, PLAYER_Y, PLAYER_W, PLAYER_H);
      }

      ctx.fillStyle = '#fff'; ctx.font = '16px "Courier New", monospace'; ctx.textAlign = 'left';
      ctx.fillText(`SCORE ${score}/${TARGET_SCORE}`, 12, 24);
      ctx.fillStyle = '#e94560'; ctx.fillText(`FAILS ${counts.X}/${MAX_FAILS}`, 12, 48);
    }

    function loop() {
      if (!running) return;
      update(); draw(); requestAnimationFrame(loop);
    }

    function playIntro() {
      isPlayingIntro = true; introFrame = 0; introPlayerX = -PLAYER_W; 
      skipBtn.style.display = 'block';

      bgmIntro.volume = 0.5;
      bgmIntro.play().catch(() => {});

      function introLoop() {
        if (!isPlayingIntro) return;
        introFrame++;
        ctx.fillStyle = '#111116'; ctx.fillRect(0, 0, W, H);

        if (introFrame < 300) {
          introPlayerX += 1.5; 
          if (introPlayerX > W / 2 - PLAYER_W / 2) introPlayerX = W / 2 - PLAYER_W / 2; 
        }

        const isHappyFrame = Math.floor(introFrame / 20) % 2 === 0;
        if (isHappyFrame && imgHappy.complete) ctx.drawImage(imgHappy, introPlayerX, PLAYER_Y, PLAYER_W, PLAYER_H);
        else if (imgNormal.complete) ctx.drawImage(imgNormal, introPlayerX, PLAYER_Y, PLAYER_W, PLAYER_H);
        else { ctx.fillStyle = isHappyFrame ? '#ffd93d' : '#4ecdc4'; ctx.fillRect(introPlayerX, PLAYER_Y, PLAYER_W, PLAYER_H); }

        if (introFrame > 200) {
          ctx.fillStyle = '#ffd93d'; ctx.font = 'bold 24px "Courier New", monospace'; ctx.textAlign = 'center';
          if (Math.floor(introFrame / 15) % 2 === 0) ctx.fillText('PIXEL CATCH', W / 2, H / 2 - 60);
        }

        if (introFrame > 100) {
          ctx.fillStyle = '#666'; ctx.font = '12px "Courier New", monospace'; ctx.textAlign = 'center';
          if (Math.floor(introFrame / 20) % 2 === 0) ctx.fillText('LOADING...', W / 2, H - 80);
        }

        if (introFrame > 360) { endIntro(); return; }
        requestAnimationFrame(introLoop);
      }
      introLoop();
    }

    function endIntro() {
      isPlayingIntro = false; skipBtn.style.display = 'none';
      bgmIntro.pause(); 
      startScreen.classList.remove('hidden');
    }

    skipBtn.addEventListener('click', () => { playClick(); endIntro(); });

    function endGame(isClear) {
      running = false;
      gameOver = true;
      endScreen.classList.remove('hidden');
      bgmGame.pause(); 

      if (isClear) {
        endTitle.innerText = 'CLEAR!';
        endTitle.style.color = '#ffd93d';
        endTitle.style.textShadow = '2px 2px 0 #000';
        
        let isHidden = (counts.A === counts.B && counts.B === counts.C && counts.C === counts.D && counts.A > 0);

        if (isHidden) {
          endTitle.innerText = 'HIDDEN ENDING?';
          endTitle.style.color = '#b388ff';
          endDesc.innerText = `恭喜你触发了隐藏结局！\n是否解锁？`;
          albumImg.style.display = 'none'; 
          hiddenPrompt.style.display = 'flex';
        } else {
          currentBest = 'A';
          ['B', 'C', 'D'].forEach(t => { if (counts[t] > counts[currentBest]) currentBest = t; });
          
          albumImg.style.display = 'block';
          albumImg.src = `album${currentBest}.jpg`; 
          endDesc.innerText = `接住最多的是 ${ITEM_NAMES[currentBest]}`;
          
          playSongBtn.style.display = 'inline-block'; 
          replayBtn.style.display = 'block';
        }
        
      } else {
        endTitle.innerText = 'GAME OVER';
        endTitle.style.color = '#e94560';
        endTitle.style.textShadow = '2px 2px 0 #ffd93d';
        endDesc.innerText = `你接了太多炸弹！\n被炸晕了...`;
        
        albumImg.style.display = 'none';
        failAnim.style.display = 'block';
        replayBtn.style.display = 'block';
        
        let isHurtFrame = false;
        failAnimInterval = setInterval(() => {
          failAnim.src = isHurtFrame ? 'player_hurt.png' : 'player_normal.png';
          isHurtFrame = !isHurtFrame;
        }, 150); 
        medias.Fail.play().catch(e => console.log('播放被拦截：', e));
      }
    }

    playSongBtn.addEventListener('click', () => {
      playClick();
      playSongBtn.style.display = 'none'; 
      medias[currentBest].play().catch(e => console.log('播放失败：', e)); 
    });

    unlockHiddenBtn.addEventListener('click', () => {
      playClick();
      hiddenPrompt.style.display = 'none';
      endDesc.innerText = `正在播放隐藏旋律...`;
      hiddenAnim.style.display = 'block';
      
      hiddenFrameIndex = 1;
      hiddenAnim.src = `hidden1.png`;
      
      hiddenAnimInterval = setInterval(() => {
        hiddenFrameIndex++;
        if (hiddenFrameIndex > 4) hiddenFrameIndex = 1;
        hiddenAnim.src = `hidden${hiddenFrameIndex}.png`;
      }, 800);

      medias.Hidden.play().catch(e => console.log('播放被拦截：', e));
      replayBtn.style.display = 'block';
    });

    skipHiddenBtn.addEventListener('click', () => {
      playClick();
      hiddenPrompt.style.display = 'none';
      let best = 'A';
      ['B', 'C', 'D'].forEach(t => { if (counts[t] > counts[best]) best = t; });
      
      albumImg.style.display = 'block';
      albumImg.src = `album${best}.jpg`; 
      endDesc.innerText = `接住最多的是 ${ITEM_NAMES[best]}`;
      
      playSongBtn.style.display = 'inline-block'; 
      replayBtn.style.display = 'block';
      
      currentBest = best; 
    });

    function startGame() {
      playClick();
      initGame();
      startScreen.classList.add('hidden');
      endScreen.classList.add('hidden');
      
      bgmGame.volume = 0.4;
      bgmGame.play().catch(() => {});

      running = true; draw(); loop();
    }

    startBtn.addEventListener('click', startGame);
    replayBtn.addEventListener('click', () => {
        playClick();
        endScreen.classList.add('hidden');
        startGame();
    });

    window.onload = () => { setTimeout(playIntro, 500); };
  </script>
</body>
</html>
